name: Azure Infrastructure & Application Deployment Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure AKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init & Apply
        id: terraform
        env:
          ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
          
          echo "ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)" >> $GITHUB_ENV
          echo "ACR_NAME=$(terraform output -raw acr_name)" >> $GITHUB_ENV
          echo "AKS_NAME=$(terraform output -raw aks_name)" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> $GITHUB_ENV
          echo "DB_HOST=$(terraform output -raw database_fqdn)" >> $GITHUB_ENV
          echo "DB_USER=$(terraform output -raw database_username)" >> $GITHUB_ENV
          echo "DB_PASSWORD=$(terraform output -raw database_password)" >> $GITHUB_ENV

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Docker Images
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          cd database
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/db-migration:${IMAGE_TAG} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/db-migration:${IMAGE_TAG}
          cd ..

          cd app
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/nodejs-app:${IMAGE_TAG} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/nodejs-app:${IMAGE_TAG}
          cd ..

      - name: Connect to AKS Cluster
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_NAME }} --overwrite-existing

      - name: Create Kubernetes Secret
        run: |
          DB_USER="${{ env.DB_USER }}"
          DB_PASSWORD="${{ env.DB_PASSWORD }}"
          DB_HOST="${{ env.DB_HOST }}"
          
          DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/portfolio?sslmode=require"
          echo "::add-mask::$DATABASE_URL"

          kubectl create secret generic app-db-secret \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run Database Migration Job
        run: |
          export JOB_NAME="db-migration-${{ github.run_id }}"
          echo "JOB_NAME=${JOB_NAME}" >> $GITHUB_ENV

          envsubst '$ACR_LOGIN_SERVER $IMAGE_TAG $JOB_NAME' < k8s/migration-job.yaml.tpl | kubectl apply -f -

          if ! kubectl wait --for=condition=complete job/${JOB_NAME} --timeout=120s; then
            echo "================ MIGRATION LOGS ================"
            kubectl logs job/${JOB_NAME} || true
            echo "================================================"
            exit 1
          fi

      - name: Deploy Node.js Application
        run: |
          kubectl apply -f k8s/service.yaml
          envsubst '$ACR_LOGIN_SERVER $IMAGE_TAG' < k8s/deployment.yaml.tpl | kubectl apply -f -

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/nodejs-app-deployment --timeout=120s
          kubectl get svc nodejs-app-service