version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Монтуємо скрипти ініціалізації (схема + імпорт)
      - ./01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./02-import.sql:/docker-entrypoint-initdb.d/02-import.sql
      # Монтуємо цілу папку з твоїми CSV, щоб вони були доступні в контейнері
      - ./csv_data:/data
    
volumes:
  pgdata: